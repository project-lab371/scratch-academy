<title>Scratch Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#fff;border-bottom:1px solid #ddd;padding:14px 20px;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:900;color:#20a84b}.search{flex:1;max-width:550px;margin:auto}.search input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}.dark{background:#17202a;color:white}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 65px)}
aside{background:#fff;border-right:1px solid #ddd;padding:18px;position:sticky;top:65px;height:calc(100vh - 65px)}
.nav{display:block;width:100%;text-align:left;background:transparent;margin:5px 0}.nav:hover,.nav.active{background:#e7f7ed;color:#16863b}
main{max-width:1100px;width:100%;margin:auto;padding:25px}.hero{background:linear-gradient(135deg,#20a84b,#087b39);color:#fff;padding:28px;border-radius:22px}
.hero h1{font-size:38px;margin:0 0 10px}.bar{height:12px;background:#ffffff44;border-radius:20px}.bar i{display:block;height:100%;width:0;background:#ffd84d;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px;margin-top:20px}.card{background:#fff;border:1px solid #ddd;border-radius:17px;padding:18px;cursor:pointer}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef5ff;color:#2866c7;font-size:12px;font-weight:bold}.emoji{font-size:30px;margin-top:8px}
.lesson{display:none}.lesson.show{display:block}.back{background:#ddd}.block{font-family:monospace;color:#fff;padding:10px 13px;border-radius:7px;margin:8px 0;width:max-content;max-width:100%;font-weight:bold}
.event{background:#e6a900}.motion{background:#4c97ff}.looks{background:#9966ff}.control{background:#ffab19}.sense{background:#5cb1d6}.var{background:#ff8c1a}
.challenge{margin-top:20px;padding:20px;border:3px dashed #20a84b;background:#f2fff6;border-radius:16px;text-align:center}
.dropzone{padding:35px 20px;border:3px dashed #20a84b;border-radius:14px;background:#fff;cursor:pointer;transition:.2s}
.dropzone:hover,.dropzone.drag{background:#dff8e8;transform:scale(1.01)}
.previewImg{max-width:100%;max-height:420px;border-radius:12px;margin-top:14px;border:1px solid #ddd}
.aiBox{margin-top:14px;padding:14px;text-align:left;background:#eef8ff;border-radius:12px}.complete{background:#20a84b;color:white;margin-top:15px}
.complete:disabled{background:#9aa4ad;cursor:not-allowed}.ok{color:#16863b;font-weight:bold}.warn{color:#a56a00;font-weight:bold}
body.dark{background:#11151b;color:#f4f7fb}body.dark header,body.dark aside,body.dark .card{background:#1b222b;color:#f4f7fb;border-color:#303a46}
body.dark .challenge{background:#13271a}.small{color:#687383;font-size:13px}
@media(max-width:700px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid #ddd}header{flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero h1{font-size:28px}}
.show{display:block !important}

/* Fixed Scratch-style block display */
.block-guide{margin-top:16px}
.block-guide-card{border:1px solid rgba(76,159,112,.30);border-radius:14px;padding:16px;background:rgba(255,255,255,.82)}
.dark .block-guide-card{background:rgba(255,255,255,.06)}
.block-guide-title{font-weight:900;font-size:18px;margin-bottom:12px}
.block-guide-row{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:12px 0}
.guide-block{
  display:block;
  width:max-content;
  max-width:100%;
  padding:10px 16px;
  border-radius:8px;
  color:#fff;
  font-weight:800;
  font-size:15px;
  line-height:1.25;
  box-shadow:0 3px 0 rgba(0,0,0,.18);
  border:1px solid rgba(0,0,0,.12);
}
.guide-event{background:#e6a51b}
.guide-motion{background:#4c97d1}
.guide-looks{background:#8b5bd6}
.guide-sound{background:#c94fc8}
.guide-control{background:#e6a229}
.guide-sensing{background:#45b89c}
.guide-variable{background:#ef8b32}
.guide-other{background:#777}
.guide-arrow{font-size:18px;font-weight:900;margin-left:14px;line-height:1}
.guide-explain{line-height:1.55;margin-top:12px}
.guide-check{font-weight:800;margin-top:9px}


.brand-icon{width:28px;height:28px;display:inline-block;vertical-align:middle;color:var(--green,#2f8f4e);flex:none}
</style>
<style>
.real-lesson,.blocks-section,.challenge,.checkpoint{margin:22px 0;padding:24px;border:1px solid var(--line,#ddd);border-radius:18px;background:rgba(255,255,255,.72)}
.real-lesson h2,.blocks-section h2,.challenge h2,.checkpoint h2{margin-top:0}
.lesson-content h3{margin:20px 0 8px}.lesson-content p,.lesson-content li{line-height:1.65}
.lesson-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.lead{font-size:1.08rem;line-height:1.6}
.block-code{background:#20242d;color:#fff;padding:16px;border-radius:14px;font-family:ui-monospace,monospace}
.fake-block{padding:9px 12px;margin:6px 0;border-radius:9px;background:#343b4d}.fake-block span{display:inline-block;width:28px;opacity:.55}
.preview{max-width:100%;max-height:430px;margin:16px auto;display:none;border-radius:14px;border:2px solid var(--line,#ddd)}
.dropzone.drag{transform:scale(1.01);border-style:solid}.continue{margin-bottom:40px}.tip{opacity:.75}.grid .card{cursor:pointer}.grid .card:active{transform:scale(.99)}
</style><!-- v8-progressive -->
<style>
.step-card{background:rgba(255,255,255,.78);border:2px solid rgba(0,0,0,.08);border-radius:20px;padding:24px;margin:18px 0}
.step-card h2{margin:8px 0 12px}
.step-card p{font-size:18px;line-height:1.6}
.progress-wrap{margin:18px 0}
.progress-label{display:flex;justify-content:space-between;font-weight:800;margin-bottom:7px}
.progress-bar{height:12px;border-radius:99px;background:#ddd;overflow:hidden}
#lessonProgressFill{height:100%;background:#4c9f70;border-radius:99px;transition:width .3s}
.fake-block{display:inline-block;margin:6px 6px 6px 0;padding:9px 13px;border-radius:8px;background:#4b91d1;color:#fff;font-weight:800}
.dropzone.drag{transform:scale(1.01);background:rgba(76,159,112,.12)}
.continue.ready{opacity:1}

/* Exact Scratch block + individual explanation layout */
.block-guide-subtitle{font-weight:700;margin:4px 0 12px}
.block-stack{margin:10px 0}
.scratch-block-line{position:relative}
.scratch-block{
  display:inline-block;
  max-width:100%;
  padding:11px 17px;
  border-radius:9px;
  color:#fff;
  font-weight:800;
  font-size:15px;
  line-height:1.25;
  box-shadow:0 3px 0 rgba(0,0,0,.2);
  border:1px solid rgba(0,0,0,.14);
}
.block-meaning{
  margin:7px 0 7px 12px;
  padding:8px 11px;
  border-left:3px solid rgba(76,159,112,.55);
  font-size:14px;
  line-height:1.45;
}
.block-connector{margin:4px 0 4px 24px;font-weight:900;font-size:18px}

</style>
<style>
.real-step-guide{margin:18px 0;padding:18px;border:2px solid #d7c59b;border-radius:16px;background:rgba(255,255,255,.84);box-shadow:0 5px 0 rgba(47,94,55,.08)}
.step-head{font-size:20px;font-weight:900;color:#2f5e37;margin-bottom:10px}.instruction{font-size:16px;line-height:1.55;margin-bottom:14px}.block-title{font-weight:900;margin-bottom:8px}.block-list{display:grid;gap:6px}.scratch-name{background:#f7c94c;border:2px solid #b88919;border-radius:10px;padding:9px 12px;font-weight:900}.block-explain{padding:2px 5px 8px 8px;line-height:1.45}.verify{margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef7ee;border-left:5px solid #4c8b55;line-height:1.45}
</style>
<style>
.real-step-guide .block-title{margin-top:16px;font-size:18px;font-weight:900}
.scratch-block-stack{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:12px 0 10px}
.scratch-block{
  position:relative;
  min-height:42px;
  max-width:100%;
  padding:10px 18px 10px 16px;
  border-radius:8px;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:16px;
  font-weight:800;
  line-height:1.2;
  box-shadow:0 3px 0 rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.2);
  border:1px solid rgba(0,0,0,.12);
}
.scratch-block.motion{background:#4c97ff}
.scratch-block.looks{background:#9966ff}
.scratch-block.sound{background:#cf63cf}
.scratch-block.events{background:#ffbf00;color:#fff}
.scratch-block.control{background:#ffab19}
.scratch-block.variables{background:#ff8c1a}
.scratch-block.sensing{background:#5cb1d6}
.scratch-block .block-text{position:relative;z-index:2}
.scratch-block .block-notch{

}
.scratch-block .block-tab{

}
.block-hint{
  margin:8px 0 12px;
  padding:9px 12px;
  border-radius:10px;

}
</style>


<style id="variable-lesson-steps">
.lesson-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.lesson-head h2{margin:.2rem 0 .35rem}
.eyebrow{font-size:.72rem;letter-spacing:.16em;font-weight:800;opacity:.65}
.lesson-count{padding:8px 12px;border-radius:999px;background:#eef7df;font-weight:800;white-space:nowrap}
.steps{display:grid;gap:14px}
.step-card{display:flex;gap:14px;padding:16px;border:1px solid rgba(0,0,0,.08);border-radius:18px;background:rgba(255,255,255,.78);transition:.18s}
.step-card.completed{border-color:#7aaa4b;box-shadow:0 5px 18px rgba(66,105,32,.08)}
.step-card.needs-attention{animation:stepshake .22s linear}
.step-number{min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#2f7d32;color:#fff;font-weight:900}

.why{padding:10px 12px;border-radius:12px;background:#fff8d8;font-size:.92rem}
.done-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;font-weight:700}
.lesson-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.lesson-note{font-size:.82rem;opacity:.68}

<script>
const names=["Découvrir Scratch","Sprites et arrière-plans","Ton premier programme","Déplacer un personnage","Les sons","Dire un message","Costumes et animation","Les événements","Les conditions SI","SI / SINON","Répéter","Répéter indéfiniment","Touches du clavier","Détection de collision","Opérateurs","Créer une variable","Faire un score","Ajouter des vies","Chronomètre","Écran de départ","Game Over","Créer un niveau","Jeu de plateforme","Labyrinthe","Jeu de course","Jeu de collecte","Listes","Clones","Ennemis multiples","IA simple","Inventaire","Boutique","Expérience et niveaux","Boss","Sauvegarde","Menus","Monde 1","Monde 2","Personnages et pouvoirs","Ennemis et boss","Polir ton jeu","Tester et corriger","Créer ton jeu complet"];

const desc=["Découvre l’interface, les sprites et les blocs.","Ajoute des personnages et des décors.","Utilise un événement pour lancer ton premier programme.","Utilise les blocs de mouvement pour déplacer ton sprite.","Ajoute des sons à ton projet.","Fais parler ton personnage.","Anime un personnage avec plusieurs costumes.","Découvre les événements et messages.","Utilise SI pour prendre une décision.","Utilise SI/SINON pour choisir entre deux actions.","Répète une action plusieurs fois.","Crée une boucle continue.","Crée les contrôles au clavier.","Détecte quand deux objets se touchent.","Compare des nombres et fais des calculs.","Stocke une valeur dans une variable.","Crée un score.","Compte les vies du joueur.","Crée un compte à rebours.","Crée un menu de départ.","Détecte la fin de la partie.","Détecte la fin d'un niveau et passe au suivant.","Crée un jeu de plateforme.","Construis un labyrinthe.","Crée un jeu de course.","Crée un jeu où l’on ramasse des objets.","Découvre les listes.","Crée plusieurs copies avec les clones.","Fais apparaître plusieurs ennemis.","Crée une IA simple.","Crée un inventaire.","Crée une boutique.","Ajoute XP et niveaux.","Crée un boss.","Imagine un système de sauvegarde.","Crée des menus et boutons.","Construis un premier monde.","Construis un deuxième monde différent.","Ajoute des pouvoirs.","Crée ennemis et boss.","Améliore sons, effets et animations.","Teste et corrige les bugs.","Assemble tout pour créer ton propre jeu."];
const testLessonData = [{"title":"Découvrir Scratch","steps":[{"instruction":"Repère les zones principales de Scratch : scène, liste des sprites et palette de blocs.","blocks":["Scène","Liste des sprites","Palette de blocs"],"explanation":"Tu sais où construire le projet et où trouver les blocs."},{"instruction":"Choisis le sprite que tu veux programmer et place-le sur la scène.","blocks":["Choisir un sprite","Positionner le sprite"],"explanation":"Le sprite sélectionné reçoit maintenant les blocs que tu ajoutes."},{"instruction":"Commence le projet avec l’événement qui lance un programme.","blocks":["quand drapeau vert cliqué"],"explanation":"Le programme démarre lorsque tu cliques sur le drapeau vert."},{"instruction":"Ajoute une action simple puis teste le projet.","blocks":["avancer de (10) pas"],"explanation":"Le sprite exécute l'action après le démarrage."}]},{"title":"Sprites et décors","steps":[{"instruction":"Ajoute ou choisis un sprite qui sera le personnage du projet.","blocks":["choisir un sprite"],"explanation":"Le personnage est prêt à être programmé."},{"instruction":"Choisis un arrière-plan adapté à ton projet.","blocks":["choisir un arrière-plan"],"explanation":"La scène donne maintenant le contexte du projet."},{"instruction":"Place le sprite à un endroit précis au début du projet.","blocks":["quand drapeau vert cliqué","aller à x: (0) y: (0)"],"explanation":"Le personnage commence toujours au même endroit."},{"instruction":"Teste le projet et vérifie que le sprite apparaît sur le bon décor.","blocks":["quand drapeau vert cliqué"],"explanation":"Le projet commence avec une scène cohérente."}]},{"title":"Premier programme","steps":[{"instruction":"Fais démarrer le programme avec le drapeau vert.","blocks":["quand drapeau vert cliqué"],"explanation":"C'est le point de départ du script."},{"instruction":"Fais dire un message au sprite pendant quelques secondes.","blocks":["dire [Bonjour !] pendant (2) secondes"],"explanation":"Le sprite affiche le message à l'écran."},{"instruction":"Ajoute ensuite un petit déplacement.","blocks":["avancer de (10) pas"],"explanation":"Le programme enchaîne maintenant deux actions."},{"instruction":"Clique sur le drapeau vert et observe l'ordre des actions.","blocks":["quand drapeau vert cliqué","dire [Bonjour !] pendant (2) secondes","avancer de (10) pas"],"explanation":"Les blocs s'exécutent de haut en bas."}]},{"title":"Mouvement","steps":[{"instruction":"Place le personnage au départ.","blocks":["quand drapeau vert cliqué","aller à x: (0) y: (0)"],"explanation":"Le point de départ est reproductible."},{"instruction":"Fais avancer le personnage d'une petite distance.","blocks":["avancer de (10) pas"],"explanation":"Le sprite se déplace dans la direction où il regarde."},{"instruction":"Ajoute un déplacement horizontal contrôlé par le clavier.","blocks":["quand [flèche droite v] est pressée","ajouter (10) à x"],"explanation":"La flèche droite déplace le sprite vers la droite."},{"instruction":"Ajoute la commande opposée pour aller à gauche.","blocks":["quand [flèche gauche v] est pressée","ajouter (-10) à x"],"explanation":"Le personnage peut maintenant se déplacer dans les deux directions."},{"instruction":"Teste plusieurs pressions et ajuste la distance si nécessaire.","blocks":["ajouter (10) à x","ajouter (-10) à x"],"explanation":"Tu obtiens un contrôle horizontal jouable."}]},{"title":"Sons","steps":[{"instruction":"Ajoute un événement qui déclenche le son.","blocks":["quand drapeau vert cliqué"],"explanation":"Le son sera lancé au début du projet."},{"instruction":"Joue un son choisi.","blocks":["jouer le son [pop v] jusqu'au bout"],"explanation":"Le sprite joue le son sélectionné."},{"instruction":"Ajoute un son court à une action du personnage.","blocks":["jouer le son [pop v]"],"explanation":"Le son peut accompagner un événement sans bloquer tout le programme."},{"instruction":"Teste et règle le volume si le son est trop fort ou trop faible.","blocks":["mettre le volum function openLesson(i){

      "Ouvre Scratch et prépare ton projet.",
      "Ajoute les blocs indiqués et assemble-les dans l'ordre.",
      "Teste avec le drapeau vert et corrige les erreurs.",
      "Améliore ton projet avec le défi.",
      "Prends une capture d'écran de ton résultat."
    ];

  let saved = parseInt(localStorage.getItem('scratchProgress_' + i) || '0', 10);
  if(isNaN(saved) || saved < 0) saved = 0;

  panel.innerHTML = `
    <button class="back" onclick="home()">← Retour aux leçons</button>
    <div class="lesson-top">
      <div>

    </div>

      <div class="progress-label">
        <span id="lessonProgressText"></span>
        <span id="lessonProgressPercent"></span>
      </div>
      <div class="progress-bar"><div id="lessonProgressFill"></div></div>
    </div>

    <div class="real-lesson">
      <div class="step-card">
        <div class="step-number" id="stepNumber"></div>
        <h2 id="stepTitle"></h2>
        <div id="stepText"></div>
        <button class="continue" id="stepButton"></button>
      </div>

      <div class="lesson-info">
        <div class="blocks-section">
          <h3>🧩 Blocs Scratch à utiliser</h3>
          <div id="lessonBlocks"></div>
        </div>

        <div class="challenge">
          <h3>🎯 Défi</h3>
          <p id="lessonChallenge"></p>
        </div>

        <div class="checkpoint">
          <h3>📸 Vérification</h3>
          <p>Quand tu as terminé la leçon, dépose une capture d'écran de ton projet Scratch.</p>

            <span>ou clique pour choisir une image</span>
            <input id="shotInput" type="file" accept="image/*" style="display:none">
          </div>
          <div id="shotPreview"></div>
          <button class="continue" id="finishButton" disabled>
            ✓ Terminer la leçon →
          </button>
        </div>
      </div>
    </div>
  `;

  window.activeLessonSteps = steps;
  window.activeLessonStep = saved;
  window.activeLessonIndex = i;

  renderProgressiveStep();
  setupDropzone(i);

  const oldShot = localStorage.getItem('scratchShot_' + i);
  if(oldShot) showPreview(oldShot);

  panel.scrollIntoView({behavior:'smooth', block:'start'});
}


function guideClass(block){
  const s = String(block).toLowerCase();
  if (s.includes("quand") || s.includes("touche") || s.includes("reçois") || s.includes("drapeau")) return "guide-event";
  if (s.includes("avancer") || s.includes("aller à") || s.includes("ajouter") && (s.includes("x") || s.includes("y")) || s.includes("tourner") || s.includes("s'orienter")) return "guide-motion";
  if (s.includes("dire") || s.includes("costume") || s.includes("arrière-plan") || s.includes("montrer") || s.includes("cacher") || s.includes("effet")) return "guide-looks";
  if (s.includes("son")) return "guide-sound";
  if (s.includes("si ") || s.includes("sinon") || s.includes("répéter") || s.includes("pour toujours") || s.includes("attendre") || s.includes("arrêter")) return "guide-control";
  if (s.includes("touche [") || s.includes("souris") || s.includes("contient")) return "guide-sensing";
  if (s.includes("mettre [") || s.includes("changer [") || s.includes("ajouter [") || s.includes("supprimer") || s.includes("liste") || s.includes("xp") || s.includes("niveau") || s.includes("score") || s.includes("vies") || s.includes("pièces") || s.includes("pv")) return "guide-variable";
  return "guide-other";
}

function scratchCategory(block){
  const b=(block||"").toLowerCase();
  if(b.includes("quand ") || b.includes("diffuser") || b.includes("quand je reçois")) return "events";
  if(b.includes("dire") || b.includes("costume") || b.includes("montrer") || b.includes("cacher")) return "looks";
  if(b.includes("son") || b.includes("jouer le son")) return "sound";
  if(b.includes("avancer") || b.includes("changer x") || b.includes("changer y") || b.includes("aller à") || b.includes("tourner") || b.includes("s'orienter") || b.includes("rebondir")) return "motion";
  if(b.includes("répéter") || b.includes("pour toujours") || b.includes("si ") || b.includes("attendre") || b.includes("arrêter") || b.includes("clone")) return "control";
  if(b.includes("score") || b.includes("vies") || b.includes("temps") || b.includes("niveau") || b.includes("xp") || b.includes("pièces") || b.includes("inventaire") || b.includes("mettre") || b.includes("ajouter")) return "variables";
  return "sensing";
}

function scratchBlock(block){
  const cat=scratchCategory(block);
  return `<div class="scratch-block ${cat}">
    <span class="block-notch"></span>
    <span class="block-text">${escapeHtml(block)}</span>
    <span class="block-tab"></span>
  </div>`;
}

function blockGuide(i,step){
  const l=lessons[i]||{};
  const raw=l.steps?.[step]||{};
  const s=typeof raw==="string"?{instruction:raw,blocks:[]}:raw;
  const total=(l.steps||[]).length||1;
  const bs=Array.isArray(s.blocks)?s.blocks:[];
  return `<div class="real-step-guide">
    <div class="step-head">🧩 Étape ${step+1} sur ${total}</div>
    <div class="instruction"><b>À faire :</b> ${escapeHtml(s.instruction||"")}</div>
    ${bs.length ? `
      <div class="block-title">🧱 Bloc(s) à utiliser dans Scratch</div>
      <div class="scratch-block-stack">${bs.map(scratchBlock).join("")}</div>
      <div class="block-hint">➡️ Cherche exactement ce bloc dans la catégorie correspondante de Scratch, puis place-le dans ton script.</div>
    ` : `
      <div class="block-hint">ℹ️ Cette étape prépare ou teste ton projet. Utilise les blocs déjà placés aux étapes précédentes.</div>
    `}
    <div class="verify">✅ <b>Teste :</b> ${step===total-1 ? "vérifie que l'objectif de la leçon fonctionne." : "fais cette étape dans Scratch, teste le résultat, puis passe à l'étape suivante."}</div>
  </div>`;
}

function renderProgressiveStep(){
  const i = window.activeLessonIndex;
  const steps = window.activeLessonSteps || [];
  const rawStep = steps[window.activeLessonStep] || {};
  const stepObj = typeof rawStep === "string" ? {instruction:rawStep,blocks:[]} : rawStep;
  const s = String(stepObj.instruction || '');
  const total = Math.max(1, steps.length);
  const n = window.activeLessonStep + 1;
  const pct = Math.round(n / total * 100);

  let title = 'Étape ' + n;
  let body = s;
  if(s.includes(' — ')){
    title = s.split(' — ')[0];
    body = s.substring(s.indexOf(' — ') + 3);
  } else if(s.includes(': ')){
    title = s.split(': ')[0];
    body = s.substring(s.indexOf(': ') + 2);
  }

  document.getElementById('stepNumber').textContent = 'ÉTAPE ' + n;
  document.getElementById('stepTitle').textContent = title;
  document.getElementById('stepText').innerHTML = '<p>' + escapeHtml(body) + '</p>' + blockGuide(i, window.activeLessonStep);
  document.getElementById('lessonProgressText').textContent = 'Étape ' + n + ' sur ' + total;
  document.getElementById('lessonProgressPercent').textContent = pct + '%';
  document.getElementById('lessonProgressFill').style.width = pct + '%';

  const l = lessons[i] || {};
  const blockList = Array.isArray(l.blocks) && l.blocks.length ? l.blocks : [];
  document.getElementById('lessonBlocks').innerHTML =
    blockList.map(b => scratchBlock(String(b))).join('');

  document.getElementById('lessonChallenge').textContent =
    l.challenge || 'Refais cette activité sans copier, puis ajoute une petite amélioration.';

  const btn = document.getElementById('stepButton');
  if(window.activeLessonStep < total - 1){
    btn.textContent = 'J’ai fait cette étape →';
    btn.onclick = function(){
      window.activeLessonStep++;
      localStorage.setItem('scratchProgress_' + i, window.activeLessonStep);
      renderProgressiveStep();
    };
  }else{
    btn.textContent = 'J’ai terminé les étapes ✓';
    btn.onclick = function(){
      document.getElementById('dropzone').scrollIntoView({behavior:'smooth', block:'center'});
    };
  }
}

function setupDropzone(i){
  const zone = document.getElementById('dropzone');
  const input = document.getElementById('shotInput');
  if(!zone || !input) return;

  zone.onclick = () => input.click();
  input.onchange = e => {
    if(e.target.files && e.target.files[0]) handleShot(e.target.files[0], i);
  };
  zone.ondragover = e => {
    e.preventDefault();
    zone.classList.add('drag');
  };
  zone.ondragleave = () => zone.classList.remove('drag');
  zone.ondrop = e => {
    e.preventDefault();
    zone.classList.remove('drag');
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleShot(e.dataTransfer.files[0], i);
  };

  const finish = document.getElementById('finishButton');
  finish.onclick = () => {
    if(localStorage.getItem('scratchShot_' + i)){
      complete(i);
    }
  };
}

function handleShot(file, i){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    localStorage.setItem('scratchShot_' + i, e.target.result);
    showPreview(e.target.result);
    const finish = document.getElementById('finishButton');
    if(finish){
      finish.disabled = false;
      finish.classList.add('ready');
    }
    if(typeof analyze === 'function'){
      try { analyze(i, e.target.result); } catch(err) {}
    }
  };
  reader.readAsDataURL(file);
}

function showPreview(src){
  const box = document.getElementById('shotPreview');
  const finish = document.getElementById('finishButton');
  if(box) box.innerHTML = '<img class="preview" src="' + src + '" alt="Capture Scratch">';
  if(finish){
    finish.disabled = false;
    finish.classList.add('ready');
  }
}

  return String(text).split('\n').map((x,i)=>x.trim()?`<div class="fake-block"><span>${i+1}</span>${escapeHtml(x)}</div>`:'').join('');
}
function setupDropzone(i){
 const d=document.getElementById('drop'),inp=document.getElementById('shot'); if(!d||!inp)return;
 d.addEventListener('click',e=>{if(e.target!==inp)inp.click()});
 ['dragenter','dragover'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.add('drag')}));

function handleShot(file,i){
 if(!file.type.startsWith('image/')){document.getElementById('status').textContent='Choisis une image PNG ou JPG.';return;}
 const r=new FileReader();
 r.onload=()=>{localStorage.setItem('scratchShot_'+i,r.result);showPreview(r.result);document.getElementById('status').textContent='✓ Capture reçue. Tu peux continuer.';document.getElementById('continueBtn').disabled=false;if(typeof analyze==='function')analyze(i,r.result);};
 r.readAsDataURL(file);
}
function showPreview(src){const p=document.getElementById('preview');if(p){p.src=src;p.style.display='block';}}

function processFile(file,i){if(!file||!file.type.startsWith("image/")){alert("Choisis une image.");return}const r=new FileReader();r.onload=async()=>{document.getElementById("preview").innerHTML=`<img class="previewImg" src="${r.result}">`;document.getElementById("aiStatus").textContent="🤖 Vérification de la capture...";localStorage.setItem("scratchShot_"+i,r.result);await analyze(r.result,i)};r.readAsDataURL(file)}
function previewShot(e,i){processFile(e.target.files[0],i)}
function dropShot(e,i){e.preventDefault();e.currentTarget.classList.remove("drag");processFile(e.dataTransfer.files[0],i)}
async function analyze(dataUrl,i){
 const status=document.getElementById("aiStatus"),box=document.getElementById("aiFeedback");await new Promise(r=>setTimeout(r,700));
 const key=localStorage.getItem("scratchAIKey")||"";
 if(!key){status.innerHTML='<span class="ok">✅ Capture reçue !</span>';box.innerHTML='';document.getElementById("continueBtn").disabled=false;return}
 try{
  const prompt=`Tu es un professeur Scratch. Leçon: ${names[i]}. Défi: ${desc[i]}. Analyse cette capture des blocs Scratch. Réponds en français avec: CORRECT ou À CORRIGER, puis une explication courte et une correction si nécessaire.`;
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:dataUrl}}]}],max_tokens:400})});
  if(!r.ok)throw Error("API");
  const j=await r.json(),t=j.choices?.[0]?.message?.content||"Analyse terminée.";
  status.innerHTML='<span class="ok">🤖 Analyse IA terminée</span>';box.innerHTML='';document.getElementById("continueBtn").disabled=false;
 }catch(e){status.innerHTML='<span class="warn">⚠️ IA en ligne indisponible</span>';box.innerHTML='';document.getElementById("continueBtn").disabled=false}
}
function escapeHtml(s){s=String(s??"");return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function complete(i){
  if(!localStorage.getItem('scratchShot_' + i)){
    alert('📸 Dépose une capture avant de continuer.');
    return;
  }

  if(!done.includes(i)){
    done.push(i);
    xp += 25;
    save();
  }

  update();

  if(i < lessons.length - 1){
    openLesson(i + 1);
  }else{
    home();
    alert('🎉 Bravo ! Tu as terminé toutes les leçons !');
  }
}

function renderLesson(lesson){
  const panel = document.getElementById("lessonPanel") || document.getElementById("lesson");
  if(!panel) return;
  const steps = lesson.steps || [];
  panel.innerHTML = `
    <div class="lesson-head">
      <div>
        <div class="eyebrow">LESSON</div>
        <h2>${escapeHtml(lesson.title)}</h2>
        <p>${steps.length} étapes — juste ce qu'il faut pour apprendre cette notion.</p>
      </div>
      <div class="lesson-count">${steps.length} étapes</div>
    </div>
    <div class="steps">
      ${steps.map((s,i)=>`
        <article class="step-card" data-step="${i}">
          <div class="step-number">${i+1}</div>
          <div class="step-content">
            <h3>Étape ${i+1}</h3>
            <p class="instruction">${escapeHtml(s.instruction)}</p>
            <div class="block-list">
              ${(s.blocks||[]).map(b=>`<span class="scratch-block">${escapeHtml(b)}</span>`).join("")}
            </div>
            <div class="why"><strong>Pourquoi ?</strong> ${escapeHtml(s.explanation)}</div>
            <label class="done-line">
              <input type="checkbox" class="step-check">
              J’ai fait cette étape dans Scratch
            </label>
          </div>
        </article>
      `).join("")}
    </div>
    <div class="lesson-footer">
      <button class="primary" id="completeLessonBtn">✓ Terminer la leçon</button>
      <span class="lesson-note">Les étapes sont plus courtes pour les notions simples et plus nombreuses pour les projets complexes.</span>
    </div>
  `;
  panel.querySelectorAll(".step-check").forEach((box)=>{
    box.addEventListener("change", ()=>{
      const card = box.closest(".step-card");
      if(card) card.classList.toggle("completed", box.checked);
      updateStepProgress(panel);
    });
  });
  const complete = panel.querySelector("#completeLessonBtn");
  if(complete){
    complete.addEventListener("click", ()=>{
      const checks = [...panel.querySelectorAll(".step-check")];
      const done = checks.filter(x=>x.checked).length;
      if(done < checks.length){
        checks.forEach(x=>{ if(!x.checked) x.closest(".step-card")?.classList.add("needs-attention"); });
        return;
      }
      if(typeof completeLesson === "function") completeLesson();
      else if(typeof saveProgress === "function") saveProgress();
    });
  }
  updateStepProgress(panel);
}

function updateStepProgress(panel){
  const boxes = [...panel.querySelectorAll(".step-check")];
  const done = boxes.filter(x=>x.checked).length;
  const pct = boxes.length ? Math.round(done/boxes.length*100) : 0;
  const bar = panel.querySelector(".step-progress-fill");
  if(bar) bar.style.width = pct + "%";
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
